[package]
name = "keyboard-voice"
version = "0.2.0"
edition = "2021"
description = "A fullscreen keyboard visualizer with offline English key names"
license = "MIT"
build = "build.rs"

[dependencies]
eframe = "0.33"
rodio = "0.19"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[build-dependencies]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
